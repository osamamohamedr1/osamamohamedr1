<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="140" viewBox="0 0 1280 140" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B5A" stop-opacity="0"/>
      <stop offset="25%" stop-color="#FF6B5A"/>
      <stop offset="75%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#A7F3D0" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes sweep { from { stroke-dashoffset: 1280 } to { stroke-dashoffset: 0 } }
      .l { stroke-dasharray: 1280; animation: sweep 2.4s cubic-bezier(.22,1,.36,1) forwards }
      @media (prefers-reduced-motion: reduce) { .l { animation: none; stroke-dasharray: none } }
    </style>
  </defs>
  <path class="l" d="M0 30 H1280" stroke="url(#line)" stroke-width="2"/>
  <text x="640" y="82" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F5F0">Thanks for stopping by<tspan fill="#FF6B5A">.</tspan></text>
  <text x="640" y="114" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9B9E9C">osamamohamedr1.github.io</text>
</svg>
